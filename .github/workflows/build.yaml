name: Build

on:
  push:
    branches:
      - main
      - ci/cd
  pull_request:
    branches:
      - main
      - ci/cd

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake make

      # If you use a Makefile:
      - name: Build (Make)
        run: |
          if [ -f Makefile ] || [ -f makefile ]; then
            make clean || true
            make -j
          else
            echo "No Makefile; skipping Make build."
          fi

